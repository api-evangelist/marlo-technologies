description: >-
  Marlo is a maritime ERP platform for dry bulk, tanker, and commercial shipping
  companies, unifying chartering, voyage management, finance, banking, and
  compliance in a single system. Operators use Marlo to plan charters, track
  voyage operations and cargo, model voyage P&L and cashflow, run valuations and
  credit scoring, manage loans and covenants, hold multi-currency accounts with
  FX transfers and corporate cards, and handle sanctions screening, emissions
  tracking, and CII rating management. Marlo is a Techstars-backed company and
  holds SOC 2 (AICPA) certification. It was surfaced as a portfolio company of
  Techstars and added to the API Evangelist network. As of this pass the company
  exposes a customer web application (app.marlo.co) but publishes no public
  developer API, API documentation, or SDKs.
